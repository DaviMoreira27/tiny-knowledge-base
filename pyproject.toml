[project]
name = "tiny-knowledge-base"
version = "0.1.0"
description = "Python data auto classifier and knowledge base used to store and organize URLs and files"
authors = [
    {name = "DaviMoreira27",email = "davimsantana2706@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "langchain (>=1.2.4)",
    "asyncpg (>=0.31.0)",
    "python-dotenv (>=1.2.1)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
